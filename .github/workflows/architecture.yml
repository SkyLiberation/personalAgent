name: Architecture & Imports

# Enforces the explicit Runtime/Capability/Governance package DAG.
# The layer gate is pure-stdlib and needs no dependencies, so it always runs fast.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  layers:
    name: Layer / cycle gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce explicit package DAG (fail closed)
        run: python scripts/check_layers.py

  lint-imports:
    name: Ruff + import health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies (pytest extra + ruff group)
        run: uv sync --extra dev --dev
      - name: Ruff (unused imports / undefined names)
        run: uv run ruff check --select F401,F811,F821 src scripts
      - name: Import health (collect full test suite)
        run: uv run pytest --collect-only -q
      - name: Import health (collect core E2E explicitly)
        run: uv run pytest --collect-only -q evals/e2e_quality

  core-e2e:
    name: Live governed user-outcome E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PERSONAL_AGENT_REQUIRE_LIVE_E2E: "true"
      PERSONAL_AGENT_E2E_TRACE_DIR: data/e2e_traces
      STRUCTURED_API_KEY: ${{ secrets.STRUCTURED_API_KEY }}
      STRUCTURED_BASE_URL: ${{ secrets.STRUCTURED_BASE_URL }}
      STRUCTURED_MODEL: ${{ secrets.STRUCTURED_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --extra dev --dev
      - name: Lint core E2E
        run: uv run ruff check evals/e2e_quality
      - name: Run live governed user-outcome E2E
        run: uv run pytest evals/e2e_quality -q -s 2>&1 | tee live-e2e.log
      - name: Upload live E2E trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-trace
          path: |
            live-e2e.log
            data/e2e_traces/
