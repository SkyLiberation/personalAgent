name: Architecture & Imports

# Enforces the explicit Runtime/Capability/Governance package DAG.
# The layer gate is pure-stdlib and needs no dependencies, so it always runs fast.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  layers:
    name: Layer / cycle gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce explicit package DAG (fail closed)
        run: python scripts/check_layers.py
      - name: Validate development and architecture documents
        run: python scripts/check_dev_spec.py

  lint-imports:
    name: Ruff + import health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies (benchmark extra + ruff group)
        run: uv sync --extra dev --dev
      - name: Ruff (unused imports / undefined names)
        run: uv run ruff check --select F401,F811,F821 src scripts
      - name: Import health and public benchmark collection
        run: |
          uv run python -m evals.open_ragbench.runner --help
          uv run python -m evals.multihoprag.runner --help
          uv run python -m evals.galileo_ragbench.runner --help
          uv run python -m evals.longDS.longds_suite --help
          uv run python -m evals.Toolathlon.parallel --help
