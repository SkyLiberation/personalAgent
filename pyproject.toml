[project]
name = "personal-agent"
version = "0.1.0"
description = "A governed personal knowledge agent runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121.0",
  "graphiti-core>=0.29.0",
  "lark-oapi>=1.6.2",
  "langgraph>=0.2.0",
  "openai>=2.36.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "psycopg[binary]>=3.2.12",
  "pypdf>=5.9.0",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.0.1",
  "tiktoken>=0.12.0",
  "typer>=0.12.3",
  "uvicorn>=0.38.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "markdown>=3.6",
  "neo4j>=6.0.0",
  "langextract>=1.5.0",
  "unstructured>=0.18.0",
]

[project.scripts]
personal-agent = "personal_agent.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "huggingface_hub>=0.28.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
# magic_stub: on environments where the only resolvable libmagic is the MSYS
# build (Git-for-Windows), importing python-magic crashes the interpreter. The
# plugin installs a no-op stub only in that case; it is inert everywhere else.
addopts = "-p testing.magic_stub"
markers = [
    "db: tests that require a running Postgres database",
    "slow: tests that take longer than 1 second",
    "integration: integration tests that exercise multiple components",
    "architecture_e2e: test is classified by evals/e2e_quality/evidence_catalog.py",
    "release_e2e: black-box process test eligible to produce release evidence",
    "diagnostic_e2e: live in-process test used to locate architecture failures",
    "e2e_layer(name): architecture evidence layer assigned by the canonical catalog",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pyarrow>=24.0.0",
    "ruff>=0.15.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
